name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check API key and release version
        id: release
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'Create the repository Actions secret NUGET_API_KEY before publishing.'
          }
          $version = & ./.github/scripts/Get-PublishVersion.ps1
          "package_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing LumisAPI $version from $env:GITHUB_REF"

  verify:
    name: Verify release
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified packages to NuGet
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          dotnet nuget push "artifacts/packages/LumisAPI.${PACKAGE_VERSION}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
